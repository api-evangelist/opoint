openapi: 3.2.0
info:
  title: Opoint Analytics API
  version: 1.0.0
  description: 'Operations tagged analytics across 2 of this provider''s published API definitions: opoint-openapi-original.yml, opoint-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.opoint.com
tags:
- name: Analytics
paths:
  /analytics/articles:
    get:
      operationId: analytics_articles_retrieve
      description: Gets the article reference based on the request
      summary: Fetch ArticleReferences
      parameters:
      - in: query
        name: articleDateEnd
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - in: query
        name: articleDateStart
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - in: query
        name: state
        schema:
          enum:
          - '-'
          - A
          - R
          type: string
          minLength: 1
        description: '* `-` - -

          * `A` - A

          * `R` - R'
        required: true
      - in: query
        name: topicIds
        schema:
          type: array
          items:
            type: integer
        required: true
      tags:
      - Analytics
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleReference'
          description: ''
    post:
      operationId: analytics_articles_create
      summary: Create ArticleReference
      tags:
      - Analytics
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '501':
          description: Not Implemented
    put:
      operationId: analytics_articles_update
      summary: Update ArticleReferences
      parameters:
      - in: query
        name: articleDateEnd
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - in: query
        name: articleDateStart
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - in: query
        name: state
        schema:
          enum:
          - '-'
          - A
          - R
          type: string
          minLength: 1
        description: '* `-` - -

          * `A` - A

          * `R` - R'
        required: true
      - in: query
        name: topicIds
        schema:
          type: array
          items:
            type: integer
        required: true
      tags:
      - Analytics
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '201':
          description: Created
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/data'
          description: Server Error
    servers:
    - url: https://api.opoint.com
