      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
      - 10
      type: integer
      description: |-
        * `2` - Article consumed
        * `3` - Article viewed for 3 sec
        * `4` - Article viewed for 10 sec
        * `5` - Article clicked
        * `6` - PDF viewed
        * `7` - Media clip played
        * `8` - Image clicked
        * `9` - Article added to tag
        * `10` - Entry fetched from Go log
