  /analytics/articles:
    get:
      operationId: analytics_articles_retrieve
      description: Gets the article reference based on the request
      summary: Fetch ArticleReferences
      parameters:
      - in: query
        name: articleDateEnd
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - in: query
        name: articleDateStart
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - in: query
        name: state
        schema:
          enum:
          - '-'
          - A
          - R
          type: string
          minLength: 1
        description: |-
          * `-` - -
          * `A` - A
          * `R` - R
        required: true
      - in: query
        name: topicIds
        schema:
          type: array
          items:
