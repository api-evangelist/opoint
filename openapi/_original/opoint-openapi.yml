          type: array
          items:
            $ref: '#/components/schemas/ScoringVariables'
      required:
      - articlesCanBeApproved
      - autoApprove
      - displayOrder
      - id
      - name
    TopicsAndEntitiesSchema:
      type: object
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/IptcTopicSchema'
        entities:
          $ref: '#/components/schemas/EntitiesSchema'
        sentiment:
          allOf:
          - $ref: '#/components/schemas/SentimentEnum'
          description: |-
            Overall sentiment of the article.

            * `Positive` - Positive
            * `Negative` - Negative
            * `Neutral` - Neutral
        sentiment_score:
          type: number
          format: double
          description: Aggregated sentiment score from -1.0 to 1.0.
    TotalStatuses:
      type: object
      properties:
        address:
          type: string
        username:
          type: string
        id_user:
          type: integer
        timestamp:
          type: integer
      required:
      - address
      - id_user
      - timestamp
      - username
    TotalStatusesPaginated:
      type: object
      properties:
        previous:
          type:
          - string
          - 'null'
        next:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/TotalStatuses'
      required:
      - next
      - previous
      - results
    TrackingExportResponse:
      type: object
      properties:
        export_id:
          type: integer
      required:
      - export_id
    TrackingInfoBasket:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    TrackingInfoResponse:
      type: object
      properties:
        tracked_articles_basket:
          oneOf:
          - $ref: '#/components/schemas/TrackingInfoBasket'
          - type: 'null'
        matched_articles_basket:
          oneOf:
          - $ref: '#/components/schemas/TrackingInfoBasket'
          - type: 'null'
      required:
      - matched_articles_basket
      - tracked_articles_basket
    TranslatedHeaderSchema:
      type: object
      properties:
        text:
          type: string
        matches:
          type: boolean
          description: Whether search matches are highlighted in this field.
        language:
          type: string
      required:
      - text
    TrendEntrySerializerv2:
      type: object
      properties:
        phrase:
          $ref: '#/components/schemas/TrendPhraseSerializerv2'
        significance:
          type: number
          format: double
        interval:
          $ref: '#/components/schemas/Interval'
        articles:
          type: array
          items:
            $ref: '#/components/schemas/ArticleIdsSerializerv2'
        epochs:
          type: array
          items:
            $ref: '#/components/schemas/TrendEpochSerializerv2'
        timestamp:
          type: integer
        burstiness:
          type: number
          format: double
      required:
      - articles
      - burstiness
      - epochs
      - interval
      - phrase
      - significance
      - timestamp
    TrendEpochSerializerv2:
      type: object
      properties:
        timestamp:
          type: integer
        articles:
          type: array
          items:
            $ref: '#/components/schemas/ArticleIdsSerializerv2'
        frequency:
          type: integer
      required:
      - articles
      - frequency
      - timestamp
    TrendExpressions:
      type: object
      properties:
        expressions:
          type: array
          items:
            $ref: '#/components/schemas/ProfileItem'
      required:
      - expressions
    TrendPhraseSerializerv2:
      type: object
      properties:
        search_term:
          type: string
        display_name:
          type: string
      required:
      - display_name
      - search_term
    TrendPreset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        params: {}
      required:
      - id
      - name
      - params
    TrendResponseSerializerv2:
      type: object
      properties:
        time_step:
          type: integer
          description: Number of seconds in each window the timeframe was divided
            into
        first_timestamp:
          type: integer
        last_timestamp:
          type: integer
        trends:
          type: array
          items:
            $ref: '#/components/schemas/TrendEntrySerializerv2'
        epoch_articles:
          type: array
          items:
            type: integer
          description: The number of articles in each time_step
      required:
      - epoch_articles
      - first_timestamp
      - last_timestamp
      - time_step
      - trends
    UUIDCommaSeparatedList:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
    UsageDataPoint:
      type: object
      properties:
        from_ts:
          type: integer
          description: Unix timestamp (UTC) of interval start (inclusive)
        to_ts:
          type: integer
          description: Unix timestamp (UTC) of interval end (exclusive)
        requests:
          type: integer
        articles:
          type: integer
        tokens:
          type: integer
        ratio:
          type: number
          format: double
          description: Articles per request
        gaps:
          type: integer
          description: 'Safefeed only: missing articles in expected sequence'
        overlaps:
          type: integer
          description: 'Safefeed only: duplicate articles delivered'
        anomaly_scores:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Per-metric anomaly scores; only present when the anomalies
            param is used
      required:
      - articles
      - from_ts
      - ratio
      - requests
      - to_ts
      - tokens
    UsageDelivery:
      type: object
      properties:
        type:
          type: string
        id:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/UsageDataPoint'
      required:
      - data
      - id
      - type
    UsageSearch:
      type: object
      properties:
        params:
          type: object
          additionalProperties: {}
      required:
      - params
    UserCommentSchema:
      type: object
      properties:
        id_user:
          type: integer
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        signature:
          type: string
        email:
          type: string
        id_group:
          type: integer
          description: Comment group the comment belongs to.
        id_site:
          type: integer
        id_article:
          type: integer
        timestamp:
          type: integer
          description: When the comment was made.
        comment:
          type: string
      required:
      - comment
      - email
      - first_name
      - id_article
      - id_group
      - id_site
      - id_user
      - last_name
      - signature
      - timestamp
      - username
    UserCommentsSchema:
      type: object
      properties:
        count:
          type: integer
        usercomment:
          type: array
          items:
            $ref: '#/components/schemas/UserCommentSchema'
      required:
      - count
    UserInvitationSearch:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
        previous:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/InvitationSearch'
      required:
      - count
      - next
      - previous
      - results
    UserMails:
      type: object
      properties:
        name:
          type: string
        mails:
          type: array
          items:
            $ref: '#/components/schemas/MailList'
      required:
      - mails
      - name
    UserRecipient:
      type: object
      properties:
        id_recipient:
          type: integer
        user_id:
          type: integer
        type:
          type: string
          readOnly: true
          default: user
        name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        mobile:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/MailSentStatus'
        message:
          type: string
        timestamp:
          type: integer
        in_previous_sending:
          type: boolean
      required:
      - email
      - id_recipient
      - in_previous_sending
      - message
      - mobile
      - name
      - status
      - timestamp
      - type
      - user_id
    UserTypeField:
      type: object
      properties:
        value:
          type: integer
        name:
          type: string
      required:
      - name
      - value
    VariableValues:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        value:
          type: string
          maxLength: 511
        isActive:
          type: boolean
          default: true
        displayGroup:
          type: integer
          maximum: 254
          minimum: 0
        variableId:
          type: integer
      required:
      - displayGroup
      - id
      - value
      - variableId
    VariableValuesChains:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parentvalueid:
          type: integer
        childvalueid:
          type: integer
      required:
      - childvalueid
      - id
      - parentvalueid
    VisibilityEnum:
      enum:
      - 1
      - 2
      type: integer
      description: |-
        * `1` - Visible when set
        * `2` - Always visible
    WatchQuery:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        last_check:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        active:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        cnt:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        query:
          type: string
      required:
      - active
      - cnt
      - id
      - last_check
      - url
    data:
      type: object
      properties:
        data:
          type: string
      required:
      - data
    invite_direct_post_request:
      type: object
      properties:
        email:
          type: array
          items:
            type: string
        owner:
          type: integer
        invitation_text:
          type: string
        alerts:
          type: array
          items:
            type: integer
      required:
      - email
      - owner
    invite_direct_post_response:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/InviteDirectPostResponseStatusEnum'
        invites:
          type: array
          items:
            $ref: '#/components/schemas/invite_direct_post_response_child'
      required:
      - invites
      - status
    invite_direct_post_response_child:
      type: object
      properties:
        email:
          type: string
        status:
          $ref: '#/components/schemas/InviteDirectPostResponseChildStatusEnum'
      required:
      - email
      - status
    updated:
      type: object
      properties:
        updated:
          type: integer
      required:
      - updated
  securitySchemes:
    JWT:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "JWT"
    cookieAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
    ephmeralId:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Ephemeral"
    staticToken:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
servers:
- url: https://api.opoint.com
