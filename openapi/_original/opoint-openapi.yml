  /alerts/{id}/history/:
    get:
      operationId: alert_history_retrieve_detail
      description: |-
        History is limited to 120 entries because some users receive an abnormally high
        amount of alerts, and the table cannot handle it.
      summary: Get alert history items
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this alert.
        required: true
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      tags:
      - alerts
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMailLog'
          description: ''
  /alerts/{id}/history/{id_item}/{stimestamp}/:
