        id_agreement:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          description: The site tag's name. Agreements on one tag share it; when exposed,
            customers see it as the licence name of its sites.
        label:
          type: string
          readOnly: true
          description: The name followed by the licence configuration's name, which
            tells same-named agreements apart.
        description:
          type:
          - string
          - 'null'
          readOnly: true
        priority:
          type: integer
          readOnly: true
          description: '1 or more: the licence configuration overrides the sites''
            own licences. 0: the two are combined.'
        expose:
          type: boolean
          readOnly: true
          description: Whether customers see the name as the licence name of its sites.
        tag:
          oneOf:
          - $ref: '#/components/schemas/AgreementTag'
          - type: 'null'
          readOnly: true
        licence_configuration:
          oneOf:
          - $ref: '#/components/schemas/LicenseConfiguration'
          - type: 'null'
          readOnly: true
          description: null when the agreement only grants access, and the sites'
            own licences apply.
        site_count:
          type: integer
          readOnly: true
        source_count:
          type: integer
          readOnly: true
          description: Single sources, on top of the sites.
        customers:
          type: integer
          readOnly: true
          description: Customers with an active, non-staff user holding the agreement,
            of their own or inherited. Counted hourly.
        created:
