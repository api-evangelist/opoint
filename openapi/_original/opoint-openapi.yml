  /storedsearch/feed/:
    get:
      operationId: storedsearch_feed_retrieve
      description: Retrieve articles from stored search baskets within a time window.
        Supports JSON and XML response formats.
      summary: Stored search feed
      parameters:
      - in: query
        name: equalgroup
        schema:
          type: boolean
          default: false
        description: Include equal group IDs
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        description: Response format
      - in: query
        name: from
        schema:
          type: integer
        description: Start of the time window (Unix timestamp)
        required: true
      - in: query
        name: id
        schema:
          type: string
        description: Comma-separated list of stored search IDs to include. If omitted,
          all active stored searches are used.
      - in: query
        name: interval
        schema:
          type: integer
          default: 900
        description: Time interval in seconds (30-1800). Set to 0 when using explicit
          'to'.
      - in: query
        name: matches
        schema:
          type: boolean
          default: false
        description: Include highlighted match data
      - in: query
        name: num_art
        schema:
          type: integer
          default: 25000
        description: Maximum number of articles to return
      - in: query
        name: readership
        schema:
          type: boolean
          default: false
        description: Include readership data
      - in: query
        name: textrazor
        schema:
          type: integer
        description: TextRazor enrichment level
      - in: query
        name: to
        schema:
          type: integer
        description: End of the time window (Unix timestamp). If omitted, calculated
          from 'from' + interval.
      - in: query
        name: topics
        schema:
          type: boolean
          default: false
        description: Include topic/subject data
      tags:
      - stored search
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultSchema'
            application/xml:
              schema:
                $ref: '#/components/schemas/SearchResultSchema'
          description: ''
        '400':
          description: Invalid parameter or interval out of range
        '429':
          description: to_time is in the future
