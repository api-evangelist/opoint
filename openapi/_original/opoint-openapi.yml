  /users/impersonation_targets/:
    get:
      operationId: users_impersonation_targets_list
      description: |-
        Search impersonation targets.

        The search syntax is simple, any spaces in the search expression, that are
        not at the start or the end are counted as AND operators, while the terms
        has to be a substring:

            tech admin

        Translates to something like

            substring(text, tech) AND substring(text, admin)

        By default, the search is run against the username, email and customer
        names concatenated.
      summary: Search impersonation targets.
      parameters:
      - in: query
        name: exclude_self
        schema:
          type: boolean
          default: false
        description: Exclude self targets from results.
      - in: query
        name: last_id_user
        schema:
          type: integer
          minimum: 0
        description: Only return results with user ids above it. Used for pagination.
      - in: query
        name: only_self
        schema:
          type: boolean
          default: false
        description: Only return results that are self targets.
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Number of results to return
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
        description: Filter results based on search term.
      tags:
      - users
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImpersonationTarget'
          description: ''
