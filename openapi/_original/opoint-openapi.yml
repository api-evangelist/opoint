openapi: 3.1.1
info:
  title: Opoint API
  version: 1.0.0
paths:
  /agreements/:
    get:
      operationId: agreements_list
      description: An agreement is one site tag's sites and single sources, on one
        licence configuration. It is named by its tag, so agreements on one tag share
        a name; `label` tells them apart. Agreements are edited in the toolkit, not
        through the API.
      summary: List agreements
      parameters:
      - in: query
        name: search_string
        schema:
          type: string
        description: Search for agreements by name or description
      tags:
      - agreements
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgreementList'
          description: ''
  /agreements/{id}:
    get:
      operationId: agreements_retrieve
      description: The agreement with its site tag (and the other agreements on it),
        its licence configuration (and the other agreements sharing it), and any scoped
        configurations. Its sites and sources are listed by the `sites` and `sources`
        endpoints.
      summary: Agreement's detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - agreements
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          description: ''
  /agreements/{id}/sites:
    get:
      operationId: agreements_sites_list
      description: The sites on the agreement's tag, by name.
      summary: Agreement's sites
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Only those whose name contains this
      tags:
      - agreements
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgreementSite'
          description: ''
  /agreements/{id}/sources:
    get:
      operationId: agreements_sources_list
      description: Sources the agreement grants on their own, on top of its sites,
        for when only part of a site is covered.
      summary: Agreement's single sources
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Only those whose name contains this
      tags:
      - agreements
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgreementSource'
          description: ''
  /alert_info/{id_maillog}/:
    get:
      operationId: alert_info_retrieve
