          description: ''
    post:
      operationId: alerts_create
      summary: Create an alert
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertCreate'
        required: true
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
          description: ''
  /alerts/{id}/:
    get:
      operationId: alerts_retrieve
      summary: Get alert by id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this alert.
        required: true
      tags:
      - alerts
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
