      summary: Invite open list
      x-summary-source: derived
    post:
      operationId: invite_open_create
      description: Create a new link invitation
      tags:
      - Invite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiUserInvitation'
            examples:
              Example1:
                value:
                  owner: 220735
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MultiUserInvitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MultiUserInvitation'
        required: true
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          description: Invitation created
        '400':
          description: Bad request, read response to see the error
        '401':
          description: User is not authorized
        '403':
          description: Hit the max users invited limit (NUM_USER_INVITES attribute)
      summary: Invite open create
      x-summary-source: derived
    servers:
    - url: https://api.opoint.com
