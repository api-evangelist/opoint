components:
  schemas:
    SingleUserInvitePaginated:
      type: object
      properties:
        count:
          type: integer
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/SingleUserInvitation'
      required:
      - count
      - next
      - previous
      - results
    PatchedMultiUserInvitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        token:
          type: string
          default: ''
        url:
          type: string
          default: ''
        owner:
          type: integer
          description: The parent user in the tree when user is created
        sent:
          type: integer
          readOnly: true
        expires:
          type: integer
          readOnly: true
        active:
          type: boolean
        usable:
          type: boolean
          readOnly: true
        reason:
          type:
          - string
          - 'null'
          readOnly: true
    MultiUserInvitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        token:
          type: string
          default: ''
        url:
          type: string
          default: ''
        owner:
          type: integer
          description: The parent user in the tree when user is created
        sent:
          type: integer
          readOnly: true
        expires:
          type: integer
          readOnly: true
        active:
          type: boolean
        usable:
          type: boolean
          readOnly: true
        reason:
          type:
          - string
          - 'null'
          readOnly: true
      required:
      - expires
      - id
      - owner
      - reason
      - sent
      - usable
    InviteDirectPostResponseStatusEnum:
      enum:
      - SUCCESS
      - PARTIAL
      - FAILED
      type: string
      description: '* `SUCCESS` - SUCCESS

        * `PARTIAL` - PARTIAL

        * `FAILED` - FAILED'
    invite_direct_post_response_child:
      type: object
      properties:
        email:
          type: string
        status:
          $ref: '#/components/schemas/InviteDirectPostResponseChildStatusEnum'
      required:
      - email
      - status
    SingleUserInvitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        token:
          type: string
          maxLength: 43
          minLength: 43
        email:
          type: string
          format: email
          maxLength: 255
        owner:
          type: integer
          description: The parent user in the tree when user is created
        invitation_text:
          type:
          - string
          - 'null'
        sent:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        expires:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_user:
          type:
          - integer
          - 'null'
          description: id of newly created user.
        status:
          allOf:
          - $ref: '#/components/schemas/SingleUserInvitationStatusEnum'
          minimum: -2147483648
          maximum: 2147483647
        usable:
          type: boolean
          readOnly: true
        reason:
          type:
          - string
          - 'null'
          readOnly: true
        role:
          type: string
          readOnly: true
      required:
      - email
      - id
      - owner
      - reason
      - role
      - token
      - usable
    SingleUserInvitationStatusEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      description: '* `0` - Failed

        * `1` - Pending

        * `2` - Accepted

        * `3` - Expired'
    MultiUserInvitePaginated:
      type: object
      properties:
        count:
          type: integer
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/MultiUserInvitation'
      required:
      - count
      - next
      - previous
      - results
    invite_direct_post_response:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/InviteDirectPostResponseStatusEnum'
        invites:
          type: array
          items:
            $ref: '#/components/schemas/invite_direct_post_response_child'
      required:
      - invites
      - status
    invite_direct_post_request:
      type: object
      properties:
        email:
          type: array
          items:
            type: string
        owner:
          type: integer
        invitation_text:
          type: string
        alerts:
          type: array
          items:
            type: integer
      required:
      - email
      - owner
    InviteDirectPostResponseChildStatusEnum:
      enum:
      - SENT
      - ALREADY_INVITED
      - FAILED
      type: string
      description: '* `SENT` - SENT

        * `ALREADY_INVITED` - ALREADY_INVITED

        * `FAILED` - FAILED'
  securitySchemes:
    JWT:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "JWT"
    cookieAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
    ephmeralId:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Ephemeral"
    staticToken:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
