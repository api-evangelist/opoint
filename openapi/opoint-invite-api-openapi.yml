openapi: 3.2.0
info:
  title: Opoint Invite API
  version: 1.0.0
  description: 'Operations tagged invite across 2 of this provider''s published API definitions: opoint-openapi-original.yml, opoint-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.opoint.com
tags:
- name: Invite
paths:
  /invite/direct/:
    get:
      operationId: invite_direct_list
      description: Get all email invitations for requesting user
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: q
        schema:
          type: string
        description: Email filter
      tags:
      - Invite
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUserInvitePaginated'
              examples:
                Example1:
                  value:
                    count: 1
                    next: null
                    previous: null
                    results:
                    - id: 1
                      token: IkhiHxv_jQ0f4jeDbz1Nz5HxIXzKaGa9x7CZSwQaMM8
                      email: user1@email.com
                      owner: 920735
                      invitation_text: null
                      sent: 1591158985
                      expires: 1691763785
                      created_user: null
                      status: 3
                      usable: false
                      reason: Invitation has expired
                    - id: 2
                      token: a9KaGxHx7CX0fSzv_jQwMM84jQaZIDbkhie5z1NzHxI
                      email: user2@email.com
                      owner: 920735
                      invitation_text: WELCOME TO INFOMEDIA!
                      sent: 1591160182
                      expires: 1691764982
                      created_user: null
                      status: 1
                      usable: false
                      reason: Invitation has expired
                  summary: Example 1
          description: ''
        '401':
          description: User is not authorized
      summary: Invite direct list
      x-summary-source: derived
    post:
      operationId: invite_direct_create
      description: Create a new email invitation and send it by email
      tags:
      - Invite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invite_direct_post_request'
            examples:
              Example1:
                value:
                  email:
                  - deveh58711@touchend.com
                  - deveh58711@infomedia.dk
                  invitation_text: Welcome to Infomedia!
                  owner: 220735
                  alerts:
                  - 123456789
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/invite_direct_post_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/invite_direct_post_request'
        required: true
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invite_direct_post_response'
          description: ''
        '400':
          description: Bad request, read response to see the error
        '401':
          description: User is not authorized
        '403':
          description: Hit the max users invited limit (NUM_USER_INVITES attribute)
      summary: Invite direct create
      x-summary-source: derived
    servers:
    - url: https://api.opoint.com
  /invite/direct/{token}/:
    get:
      operationId: invite_direct_retrieve
      description: Get a specific email invitation with a id
      parameters:
      - in: path
        name: token
        schema:
          type: string
        description: token
        required: true
      tags:
      - Invite
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUserInvitation'
              examples:
                Example1:
                  value:
                    id: 32
                    token: a9KaGxHx7CX0fSzv_jQwMM84jQaZIDbkhie5z1NzHxI
                    email: deveh58711@touchend.com
                    owner: 220735
                    invitation_text: WELCOME TO INFOMEDIA!
                    sent: 1691481226
                    expires: 1692086026
                    created_user: null
                    status: 3
                    usable: false
                    reason: Invitation has expired
                  summary: Example 1
          description: ''
        '404':
          description: Invitation not found
        '401':
          description: User is not authorized
      summary: Invite direct retrieve
      x-summary-source: derived
    delete:
      operationId: invite_direct_destroy
      description: 'Deleting an pending, failed or expired email invitation. Accepted invites can''t be deleted

        Don''t forget the trailing slash'
      parameters:
      - in: path
        name: token
        schema:
          type: string
        description: token
        required: true
      tags:
      - Invite
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '204':
          description: Invitation has been deleted
        '404':
          description: Invitation not found
        '401':
          description: User is not authorized
        '412':
          description: Invitation has already been accepted
      summary: Invite direct destroy
      x-summary-source: derived
    servers:
    - url: https://api.opoint.com
  /invite/direct/{token}/accept/:
    post:
      operationId: invite_direct_accept_create
      description: Accept an email invite and create a new user
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Invite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleUserInvitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SingleUserInvitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SingleUserInvitation'
        required: true
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUserInvitation'
          description: ''
      summary: Invite direct accept create
      x-summary-source: derived
    servers:
    - url: https://api.opoint.com
