openapi: 3.2.0
info:
  title: Opoint Sites API
  version: 1.0.0
  description: 'Operations tagged sites across 2 of this provider''s published API definitions: opoint-openapi-original.yml, opoint-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.opoint.com
tags:
- name: Sites
paths:
  /sites/:
    get:
      operationId: sites_list
      description: This endpoint serves for returning all sites with their sources.
      summary: List sites
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Search sites by country
      - in: query
        name: cursor
        schema:
          type: string
        description: Url of the next page
      - in: query
        name: id_agreement
        schema:
          type: integer
        description: Agreement id (-1 means all Sites without an agreement)
      - in: query
        name: name
        schema:
          type: string
        description: Search by site's name
      - in: query
        name: page_size
        schema:
          type: integer
        description: Page size
      tags:
      - Sites
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitesListPaginated'
          description: ''
    servers:
    - url: https://api.opoint.com
  /sites/{id_site}:
    get:
      operationId: sites_retrieve
      summary: Site detail
      parameters:
      - in: path
        name: id_site
        schema:
          type: integer
        description: A unique integer value identifying this site.
        required: true
      tags:
      - Sites
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDetail'
              examples:
                SiteDetailExample:
                  value:
                    id_site: 4214
                    id_agreement: 123
                    name: Site Name
                    summarizer_param:
                      license:
                        type: 1
                        number_of_sentences: 10
                        max_percentage_of_characters_to_show: 30
                        max_number_of_words_to_show: 123
                      report_license:
                        type: 1
                        number_of_sentences: 10
                        max_percentage_of_characters_to_show: 30
                        max_number_of_words_to_show: 123
                      mail_license:
                        type: 1
                        number_of_sentences: 10
                        max_percentage_of_characters_to_show: 30
                        max_number_of_words_to_show: 123
                      share_license:
                        type: 1
                        number_of_sentences: 10
                        max_percentage_of_characters_to_show: 30
                        max_number_of_words_to_show: 123
                    max_archive_age: 80000
                    max_free_search_age: 80000
                    sources:
                    - id_source: 123
                      name: Source Name
                      licence: 64
                      licence_share: 64
                      licence_mail: 64
                      licence_report: 64
                      licence_enforce: 64
                      licence_enforce_share: 64
                      licence_enforce_mail: 64
                      licence_enforce_report: 64
                  summary: Site detail example
          description: ''
    patch:
      operationId: sites_partial_update
      description: This endpoint serves for updating site and source options in the Site view.
      summary: Update site's and sources' settings
      parameters:
      - in: path
        name: id_site
        schema:
          type: integer
        description: A unique integer value identifying this site.
        required: true
      tags:
      - Sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSiteAndSourceDetailRequest'
            examples:
              SiteAndSourcePATCHRequestExample:
                value:
                  site_options:
                    summarizer_param:
                      license:
                        type: 1
                        number_of_sentences: 10
                        max_percentage_of_characters_to_show: 30
                        max_number_of_words_to_show: 123
                      report_license:
                        type: 1
                        number_of_sentences: 10
                        max_percentage_of_characters_to_show: 30
                        max_number_of_words_to_show: 123
                      mail_license:
                        type: 1
                        number_of_sentences: 10
                        max_percentage_of_characters_to_show: 30
                        max_number_of_words_to_show: 123
                      share_license:
                        type: 1
                        number_of_sentences: 10
                        max_percentage_of_characters_to_show: 30
                        max_number_of_words_to_show: 123
                    max_archive_age: 80000
                    max_free_search_age: 80000
                  source_options:
                    licence: 64
                    licence_share: 64
                    licence_mail: 64
                    licence_report: 64
                    licence_enforce: 64
                    licence_enforce_share: 64
                    licence_enforce_mail: 64
                    licence_enforce_report: 64
                summary: Site and source PATCH request example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSiteAndSourceDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSiteAndSourceDetailRequest'
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAndSourceDetailResponse'
              examples:
                SiteAndSourceDetailPATCHResponseExample:
                  value:
                    site_options:
                      id_site: 4214
                      name: SiteName
                      summarizer_param:
                        license:
                          type: 1
                          number_of_sentences: 10
                          max_percentage_of_characters_to_show: 30
                          max_number_of_words_to_show: 123
                        report_license:
                          type: 1
                          number_of_sentences: 10
                          max_percentage_of_characters_to_show: 30
                          max_number_of_words_to_show: 123
                        mail_license:
                          type: 1
                          number_of_sentences: 10
                          max_percentage_of_characters_to_show: 30
                          max_number_of_words_to_show: 123
                        share_license:
                          type: 1
                          number_of_sentences: 10
                          max_percentage_of_characters_to_show: 30
                          max_number_of_words_to_show: 123
                      max_archive_age: 80000
                      max_free_search_age: 80000
                    source_options:
                      licence: 64
                      licence_share: 64
                      licence_mail: 64
                      licence_report: 64
                      licence_enforce: 64
                      licence_enforce_share: 64
                      licence_enforce_mail: 64
                      licence_enforce_report: 64
                  summary: Site and source detail PATCH response example
          description: Site's settings changed
    servers:
    - url: https://api.opoint.com
  /sites/get-multiple:
    post:
      operationId: sites_get_multiple_create
      description: Retrieve details of multiple sites given a list of site IDs.
      tags:
      - Sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdSiteList'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdSiteList'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdSiteList'
        required: true
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteList'
          description: ''
      summary: Sites get multiple create
      x-summary-source: derived
    servers:
    - url: https://api.opoint.com
  /sites/reports/:
    post:
      operationId: sites_reports_create
      description: 'Runs a site search (same request shape as a normal search: searchterm/expressions + params) and returns the results as an .xlsx file, either synchronously or asynchronously.'
      summary: Create a site search report
      parameters:
      - in: query
        name: task
        schema:
          type: string
          enum:
          - async
          - sync
          default: sync
        description: '`sync` (default) generates the report inline and returns it directly. `async` creates a SiteSearchReport row and a notification, generates the file via Celery, and it is later fetched through the generic report download endpoint.'
      tags:
      - Sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteSearchReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteSearchReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteSearchReport'
        required: true
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/*:
              schema:
                type: string
                format: binary
          description: XLSX file containing the site search report.
        '202':
          content:
            application/*:
              schema:
                $ref: '#/components/schemas/SiteSearchReportAsyncResponse'
          description: Report generation has been queued.
    servers:
    - url: https://api.opoint.com
  /sites/requests/:
    get:
      operationId: sites_requests_list
      description: Returns a paginated list of site requests.
      summary: List site requests
      parameters:
      - in: query
        name: billable
        schema:
          type: boolean
      - in: query
        name: comment
        schema:
          type: string
      - in: query
        name: conclusion
        schema:
          type: integer
      - in: query
        name: conclusion__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: deadline_after
        schema:
          type: string
          format: date-time
      - in: query
        name: deadline_before
        schema:
          type: string
          format: date-time
      - in: query
        name: express
        schema:
          type: boolean
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: id__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: id_customer
        schema:
          type: integer
      - in: query
        name: id_customer__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: id_site
        schema:
          type: integer
      - in: query
        name: id_site__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: id_site_max
        schema:
          type: integer
      - in: query
        name: id_site_min
        schema:
          type: integer
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum number of site requests to return.
      - in: query
        name: mapping_project
        schema:
          type: string
      - in: query
        name: mapping_project__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: offset
        schema:
          type: integer
        description: Offset within the result set.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: otb_active
        schema:
          type: boolean
      - in: query
        name: reference
        schema:
          type: string
      - in: query
        name: request_time_after
        schema:
          type: string
          format: date-time
      - in: query
        name: request_time_before
        schema:
          type: string
          format: date-time
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive search across URL, site name, and comment.
      - in: query
        name: servicepack_tier
        schema:
          type: integer
      - in: query
        name: site_name
        schema:
          type: string
      - in: query
        name: site_url
        schema:
          type: string
      - in: query
        name: sitename
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: integer
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: tagged_by
        schema:
          type: integer
      - in: query
        name: tagged_by__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: url
        schema:
          type: string
      tags:
      - Sites
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteRequest'
          description: ''
    post:
      operationId: sites_requests_create
      summary: Create a site request
      tags:
      - Sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteRequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteRequestCreate'
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteRequest'
          description: ''
    servers:
    - url: https://api.opoint.com
  /sites/requests/{id}/:
    get:
      operationId: sites_requests_retrieve
      summary: Retrieve a site request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site request.
        required: true
      tags:
      - Sites
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteRequest'
          description: ''
    put:
      operationId: sites_requests_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site request.
        required: true
