      summary: Estimate deadlines for new site requests
      parameters:
      - in: query
        name: express
        schema:
          type: integer
        description: Number of express requests.
      - in: query
        name: num
        schema:
          type: integer
        description: Total number of requested sites.
        required: true
      tags:
      - Sites
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          description: Array of ISO-8601 formatted dates representing the estimated deadlines.
    servers:
