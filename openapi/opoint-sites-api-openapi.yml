      - Sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
