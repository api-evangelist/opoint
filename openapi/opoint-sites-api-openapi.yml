                $ref: '#/components/schemas/SiteRequest'
          description: ''
      summary: Sites requests update
      x-summary-source: derived
    patch:
      operationId: sites_requests_partial_update
      summary: Update a site request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site request.
        required: true
      tags:
      - Sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSiteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSiteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSiteRequest'
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteRequest'
          description: ''
    delete:
      operationId: sites_requests_destroy
      description: Deletes the site request and its linked NameMap row, if any.
      summary: Delete a site request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site request.
        required: true
      tags:
      - Sites
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
    servers:
    - url: https://api.opoint.com
