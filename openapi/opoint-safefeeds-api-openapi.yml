openapi: 3.2.0
info:
  title: Opoint Safefeeds API
  version: 1.0.0
  description: 'Operations tagged safefeeds across 2 of this provider''s published API definitions: opoint-openapi-original.yml, opoint-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.opoint.com
tags:
- name: safefeeds
paths:
  /safefeeds/:
    get:
      operationId: safefeeds_list
      description: 'Lists available SafeFeeds.


        A user will have access to certain SafeFeeds, which contain their access_key, id,

        and id_list to a connected PredefinedDBList. This has an id_list name.'
      summary: List available safefeeds
      tags:
      - safefeeds
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Safefeed'
          description: ''
    servers:
    - url: https://api.opoint.com
  /safefeeds/{id}/:
    get:
      operationId: safefeeds_retrieve
      description: Retrieves a single Safefeed
      summary: Retrieve a safefeed
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - safefeeds
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Safefeed'
          description: ''
    patch:
      operationId: safefeeds_partial_update
      description: Update a safefeed
      summary: Partially update a safefeed
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - safefeeds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSafefeed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSafefeed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSafefeed'
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
    servers:
    - url: https://api.opoint.com
  /safefeeds/{id}/feed/:
    get:
      operationId: safefeeds_feed_retrieve
      summary: Retrieve articles from the safefeed
      parameters:
      - in: query
        name: doc_format
        schema:
          type: string
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - xml
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: lastid
        schema:
          type: string
      - in: query
        name: num_art
        schema:
          type: integer
      tags:
      - safefeeds
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/SearchResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: ''
    servers:
    - url: https://api.opoint.com
  /safefeeds/{id}/lastids/:
    get:
      operationId: safefeeds_lastids_list
      description: Get named last ids for a specific safefeed
      summary: Retrieve named lastids for the safefeed
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - safefeeds
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
