                type: array
                items:
                  $ref: '#/components/schemas/SafefeedLastId'
          description: ''
    servers:
    - url: https://api.opoint.com
  /safefeeds/{id}/logs/:
    get:
      operationId: safefeeds_logs_retrieve
      description: 'Get logs for a specific safefeed with timestamp filtering.

        Required query parameters:

        - start_time: Unix timestamp (seconds since epoch)

        - end_time: Unix timestamp (seconds since epoch)

        Optional query parameters:

        - limit: Maximum number of records to return (default: 100)

        - offset: Number of records to skip (default: 0)'
      summary: Retrieve request logs for the safefeed
      parameters:
      - in: query
        name: end_time
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: start_time
        schema:
          type: integer
      tags:
      - safefeeds
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafefeedLogResponse'
          description: ''
    servers:
    - url: https://api.opoint.com
  /safefeeds/{id}/stats/:
    get:
      operationId: safefeeds_stats_retrieve
      description: 'Get statistics for a specific safefeed with timestamp filtering.

        Required query parameters:

        - start_time: Unix timestamp (seconds since epoch)

        - end_time: Unix timestamp (seconds since epoch)'
      summary: Retrieve request logs statistics for the safefeed
      parameters:
      - in: query
        name: end_time
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: start_time
        schema:
          type: integer
      tags:
      - safefeeds
      security:
      - JWT: []
      - ephmeralId: []
      - staticToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafefeedStats'
          description: ''
    servers:
    - url: https://api.opoint.com
