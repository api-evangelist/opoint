apis:
- name: Opoint Suggestion Server API
  description: >-
    A search engine for filters that translates site names, URLs, countries, languages and other filter
    names in natural language into the ids the Opoint search API understands, and back again, designed
    for interactive search UIs. Served at suggest.api.opoint.com/suggest/{language}/... with the parameters
    documented in the suggestion server reference.
  humanURL: https://api-docs.opoint.com/references/suggestion-server
  baseURL: https://suggest.api.opoint.com
  tags:
  - Search
  - Suggestions
  - Autocomplete
  - News
  properties:
  - type: Documentation
    url: https://api-docs.opoint.com/references/suggestion-server
  - type: GettingStarted
    url: https://api-docs.opoint.com/guides/using-the-suggestion-server
  aid: opoint:opoint-suggestion-server-api
- name: Opoint SafeFeed API
  description: >-
    Pull feed of real-time global news data at feed.opoint.com/safefeed.php, advanced with a lastid cursor
    taken from the opoint_search_start element of each response, returning XML or JSON batches of up to
    5,000 articles with optional readership, topics and entities enrichment. The documented way to consume
    it is the official opoint Python library (SafefeedClient), which manages the cursor, batch size and
    request interval.
  humanURL: https://api-docs.opoint.com/references/safefeed
  baseURL: https://feed.opoint.com
  tags:
  - News
  - Feeds
  - Real-time
  - Media Monitoring
  properties:
  - type: Documentation
    url: https://api-docs.opoint.com/references/safefeed
  - type: SDK
    url: https://pypi.org/project/opoint/
  aid: opoint:opoint-safefeed-api
