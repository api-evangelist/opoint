aid: opoint
name: Opoint
description: Opoint is a Copenhagen-based real-time global news data provider in the Infomedia group. It crawls news from
  more than 250,000 online sources in 135 languages, and sells that data to media-monitoring, compliance (adverse media, AML/KYC,
  due diligence), financial-services and business-intelligence buyers. Developers reach it through the Opoint REST API on
  api.opoint.com (archive Search, StoredSearch near-real-time feeds, Alerts, Profiles, Tags, Tracking of press releases, Analytics,
  Trends), the SafeFeed pull feed on feed.opoint.com, and a suggestion server on suggest.api.opoint.com that translates names
  and URLs into filter ids, with enrichment such as topics and entities, readership estimates and sentiment. An OpenAPI 3.1
  contract is served at api.opoint.com/schema/ and a Python client library is published on PyPI.
url: https://raw.githubusercontent.com/api-evangelist/opoint/refs/heads/main/apis.yml
